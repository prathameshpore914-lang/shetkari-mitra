</style>

<body>
<div id="app"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { v = parseFloat(v); return isFinite(v) && v >= 0 ? v : 0; };
const ld = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

let users = ld('sm_users', [
  { phone: '9876543210', name: 'रमेश पाटील', role: 'worker', village: 'अष्टा', salt: 'demo', hash: 'demo' },
  { phone: '9876543211', name: 'लता जाधव', role: 'worker', village: 'कराड', salt: 'demo', hash: 'demo' }
]);
let me = ld('sm_sess', null);
let jobs = ld('sm_jobs', [
  { id: 1001, work: 'ऊस तोडणी', village: 'अष्टा', date: 'उद्या सकाळी ७ वा.', wage: 500, need: 2, interest: ['9876543210'], confirmed: [], status: 'open', farmer: 'demo' }
]);
let wages = ld('sm_wages', { rate: 300, paid: {} });
let tasks = ld('sm_tasks', {});
let diary = ld('sm_diary', []);

let S = {
  lang: 'mr',
  v: 'home',
  auth: 'login',
  roleQuick: 'farmer',
  ans: 'नमस्कार! बोलून, टाइप करून किंवा बोटाने लिहून शेती, हवामान, बाजारभाव किंवा कामाबद्दल विचारा.',
  queryText: '',
  aiMode: 'voice',
  listen: false,
  gpsMode: 'gmaps',
  selectedPinId: 1,
  userCoords: { lat: 16.9482, lng: 74.4093 },
  locIdx: 0,
  log: '',
  calc: null,
  calcIn: [],
  learn: null,
  crop: 'ऊस',
  strokes: []
};

const LANGS = {
  mr: { bcp: 'mr-IN', title: 'शेतकरी मित्र', rows: [
    ['अ','आ','इ','ई','उ','ऊ','ए','ऐ','ओ','औ'],
    ['क','ख','ग','घ','च','छ','ज','झ','ट','ठ'],
    ['त','थ','द','ध','न','प','फ','ब','भ','म'],
    ['य','र','ल','व','श','ष','स','ह','ळ','ा','ि','ी','ु','ू','े','ो','ं']
  ]},
  hi: { bcp: 'hi-IN', title: 'किसान मित्र', rows: [
    ['अ','आ','इ','ई','उ','ऊ','ए','ऐ','ओ','औ'],
    ['क','ख','ग','घ','च','छ','ज','झ','ट','ठ'],
    ['त','थ','द','ध','न','प','फ','ब','भ','म'],
    ['य','र','ल','व','श','स','ह','ा','ि','ी','ु','ू','े','ो','ं']
  ]},
  en: { bcp: 'en-IN', title: 'Shetkari Mitra', rows: [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M','?']
  ]}
};

const PINS = [
  { id: 1, type: 'worker', name: 'रमेश मजूर', x: 32, y: 42, steps: 650, mins: 7, dLat: 0.004, dLng: -0.003 },
  { id: 2, type: 'worker', name: 'लता व गट', x: 34, y: 68, steps: 1500, mins: 15, dLat: -0.006, dLng: -0.002 },
  { id: 3, type: 'tractor', name: 'संजय ट्रॅक्टर', x: 68, y: 40, steps: 1100, mins: 11, dLat: 0.005, dLng: 0.006 }
];

const LOCATIONS = [
  { name: 'अष्टा / सांगली', query: 'Ashta, Sangli, Maharashtra', temp: '29°C', humidity: '54%', rain: '10%', wind: '12 km/h', soil: 'काळी कसदार जमीन', ph: '6.8 (उत्तम)' },
  { name: 'पंढरपूर / सोलापूर', query: 'Pandharpur, Maharashtra', temp: '31°C', humidity: '46%', rain: '5%', wind: '15 km/h', soil: 'मध्यम काळी माती', ph: '7.1 (चांगली)' },
  { name: 'कराड / सातारा', query: 'Karad, Maharashtra', temp: '28°C', humidity: '58%', rain: '15%', wind: '10 km/h', soil: 'तांबडी व काळी जमीन', ph: '6.5 (उत्तम)' }
];

const LEARN = [
  ['🧪', 'खते (Fertilizers)', 'कंपोस्ट, गांडूळखत, शेणखत ही सेंद्रिय खते मातीचा पोत सुधारतात. युरिया (46% N), DAP (18:46:0), MOP (0:0:60) ही रासायनिक खते आहेत. मात्रा माती परीक्षण व कृषी शिफारशीनुसारच ठरवा.'],
  ['🌿', 'तण ओळख (Weeds)', 'गाजर गवत (Parthenium): हातमोजे व मास्क वापरा, फुलोऱ्यापूर्वी काढा. लव्हाळा (Cyperus): कंद जमिनीत राहतात, वारंवार काढा. हरळी (Cynodon): धावती खोडे गोळा करा.'],
  ['🌱', 'जमीन व सिंचन', 'काळी जमीन: ओलावा जास्त धरते. ठिबक सिंचन: पाण्याची ५०% बचत होते, फिल्टर नियमित साफ ठेवा.'],
  ['🚑', 'आरोग्य व सुरक्षा (112)', 'उष्माघात किंवा औषध फवारणीत विषबाधा झाल्यास त्वरित 112 वर कॉल करा. फवारणी करताना मास्क व हातमोजे वापरा.'],
  ['🏛️', 'सरकारी योजना व निर्यात', 'PM-KISAN, पीक विमा, सिंचन अनुदान: pmkisan.gov.in व agri.maharashtra.gov.in वर तपासा. निर्यातीसाठी IEC व APEDA नोंदणी आवश्यक (apeda.gov.in).']
];

const save = () => {
  sv('sm_jobs', jobs);
  sv('sm_wages', wages);
  sv('sm_tasks', tasks);
  sv('sm_diary', diary);
};

const speak = txt => {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = LANGS[S.lang].bcp;
    u.rate = 0.92;
    speechSynthesis.speak(u);
  } catch (e) {}
};

const go = v => { S.v = v; render(); window.scrollTo(0, 0); };

// Auth
async function hp(pw, salt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + pw));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const cu = () => users.find(u => u.phone === me);
const WN = p => (users.find(u => u.phone === p) || {}).name || p;

async function doReg() {
  const name = $('an').value.trim(), ph = $('ap').value.trim(), pw = $('aw').value;
  if (!name || !/^[6-9]\d{9}$/.test(ph)) return alert('नाव व बरोबर 10 अंकी मोबाईल नंबर टाका');
  if (pw.length < 6) return alert('पासवर्ड किमान 6 अक्षरांचा हवा');
  if (users.some(u => u.phone === ph)) return alert('हा नंबर आधीच नोंदणीकृत आहे');
  const salt = [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16)).join('');
  users.push({ phone: ph, name, role: $('ar').value, village: $('av').value.trim() || 'अष्टा', salt, hash: await hp(pw, salt) });
  sv('sm_users', users);
  me = ph; sv('sm_sess', me); render();
}

async function doLogin() {
  const ph = $('ap').value.trim(), u = users.find(x => x.phone === ph);
  if (u && await hp($('aw').value, u.salt) === u.hash) {
    me = ph; sv('sm_sess', me); return render();
  }
  alert('मोबाईल नंबर किंवा पासवर्ड चुकीचा');
}

function quickDemoLogin(role) {
  const ph = role === 'farmer' ? '9000000001' : '9876543210';
  if (!users.some(u => u.phone === ph)) {
    users.push({ phone: ph, name: role === 'farmer' ? 'शेतकरी साहेब' : 'रमेश पाटील', role, village: 'अष्टा', salt: 'demo', hash: 'demo' });
    sv('sm_users', users);
  }
  me = ph; sv('sm_sess', me); render();
}

function logout() { me = null; sv('sm_sess', null); render(); }

// Voice & AI
function askAI(q) {
  const text = (q !== undefined ? q : S.queryText).trim();
  if (!text) return;
  S.queryText = text;
  const low = text.toLowerCase();
  let a = '';
  if (/पाऊस|हवामान|मौसम|weather/.test(low)) {
    a = 'आज हवामान स्वच्छ राहील, तापमान २९°C आहे आणि पुढील ३ दिवस पावसाची शक्यता नाही.';
  } else if (/भाव|मंडी|कांदा|सोयाबीन|price/.test(low)) {
    a = 'आज बाजारात सोयाबीन ४,६५० रुपये क्विंटल आणि कांदा २,२०० रुपये क्विंटल दराने विकला जात आहे.';
  } else if (/पाणी|सिंचन|water/.test(low)) {
    a = 'पाणी देण्यापूर्वी मातीचा ओलावा हाताने तपासा. ठिबक सिंचनाने ५०% पाण्याची बचत होते.';
  } else if (/मजूर|काम|पगार|wage|job/.test(low)) {
    a = 'काम व कामगार विभागात नवीन काम टाकता येते आणि मजुरांची हजेरी व पगार मोजता येतो.';
  } else {
    a = `"${text}" बद्दल माहिती: मी तुमचा शेतकरी मित्र आहे. हवामान, सिंचन, खते, मजुरी किंवा बाजारभावाबद्दल विचारा.`;
  }
  S.ans = a;
  speak(a);
  render();
}

function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('या ब्राउझरमध्ये माईक ओळख उपलब्ध नाही. खाली टाइप करा.'); return; }
  const r = new SR();
  r.lang = LANGS[S.lang].bcp;
  S.listen = true; render();
  r.onresult = e => { S.listen = false; askAI(e.results[0][0].transcript); };
  r.onerror = r.onend = () => { S.listen = false; render(); };
  try { r.start(); } catch (e) { S.listen = false; render(); }
}

// Jobs & SMS
function postJob() {
  const w = $('jw').value.trim(), v = $('jv').value.trim(), d = $('jd').value.trim(), wg = num($('jg').value), n = Math.floor(num($('jn').value));
  if (!w || !v || !wg || !n) return alert('सर्व माहिती भरा');
  jobs.unshift({ id: Math.max(1000, ...jobs.map(j => j.id)) + 1, work: w, village: v, date: d || 'उद्या', wage: wg, need: n, interest: [], confirmed: [], status: 'open', farmer: me });
  save(); render();
}

function applyJob(id) {
  const j = jobs.find(x => x.id == id);
  if (!j || j.status !== 'open') return;
  j.interest = j.interest.includes(me) ? j.interest.filter(x => x !== me) : [...j.interest, me];
  save(); render();
}

function confirmW(id, p) {
  const j = jobs.find(x => x.id == id);
  if (!j || j.status !== 'open' || j.confirmed.length >= j.need) return;
  j.confirmed.push(p);
  if (j.confirmed.length >= j.need) j.status = 'filled';
  save();
  S.log = `✅ SMS पाठवला: ${WN(p)} — तुमचे काम निश्चित झाले (Job ${id})`;

function smsSim() {
  const p = $('sp').value, t = $('st').value.trim();
  const m = t.match(/^(YES|NO|होय|नाही)\s+(\d+)$/i);
  let out = '';
  if (!m) out = 'चुकीचे उत्तर. "YES 1001" किंवा "NO 1001" पाठवा.';
  else {
    const j = jobs.find(x => x.id == m[2]);
    const yes = /^(yes|होय)$/i.test(m[1]);
    if (!j) out = 'Job क्रमांक सापडला नाही.';
    else if (!yes) { j.interest = j.interest.filter(x => x !== p); out = 'नोंद केली: नकार.'; }
    else { if (!j.interest.includes(p)) j.interest.push(p); out = 'होकार नोंदवला! शेतकऱ्याने निश्चित केल्यावर काम पक्के होईल.'; }
  }
  save();
  S.log = `📱 ${t}
↩ ${out}`;
  render();
}

// Calc
function calcProfit() {
  const g = id => num($(id).value);
  const cost = g('c1') + g('c2') + g('c3') + g('c4') + g('c5');
  const sell = g('s1') + g('s2') + g('s3');
  const rev = g('q') * g('pr');
  S.calc = { cost, sell, rev, net: rev - cost - sell };
  S.calcIn = [...document.querySelectorAll('#calcf input')].map(i => i.value);
  render();
}

function initHwCanvas() {
  const canvas = $('hwCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#145a32';
  let drawing = false;
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  };
  canvas.onmousedown = canvas.ontouchstart = e => {
    drawing = true;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
  };
  canvas.onmousemove = canvas.ontouchmove = e => {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.lineTo(p.x, p.y); ctx.stroke();
  };
  window.onmouseup = canvas.ontouchend = () => { drawing = false; };
}

    const k = new Date().toDateString();
    const list = [['💧','मातीचा ओलावा हाताने तपासा'],['🍃','पानांवर कीड किंवा रोग आहे का पाहा'],['⛅','आजचा हवामान अंदाज तपासा']];
    return `<div class="p">
      <h2>📅 आजची शेती कामे</h2>
      <select onchange="S.crop=this.value;render()">${['ऊस','कांदा','सोयाबीन','टोमॅटो'].map(c => `<option ${c===S.crop?'selected':''}>${c}</option>`).join('')}</select>
      ${list.map((t, i) => `
        <div class="card row" style="align-items:center">
          <b>${t[0]} ${t[1]} (${S.crop})</b>
          <button class="btn ${tasks[k+i]?'s':'o'}" style="flex:0 0 100px" onclick="tasks['${k+i}']=!tasks['${k+i}'];save();render()">${tasks[k+i]?'✓ झाले':'झाले'}</button>
        </div>
      `).join('')}
      <h2>📒 शेती डायरी</h2>
      <input id="dt" placeholder="उदा. आज ऊसाला पाणी दिले">
      <button class="btn" onclick="if($('dt').value.trim()){diary.unshift({d:new Date().toLocaleDateString('mr-IN'),t:$('dt').value.trim()});save();render()}">नोंद जतन करा</button>
      ${diary.map(d => `<div class="card"><b>${d.d}:</b> ${esc(d.t)}</div>`).join('')}
    </div>`;
  }

  return `<div class="p">
    <h2>📚 शेती ज्ञान, योजना व सुरक्षा</h2>
    ${LEARN.map((l, i) => `
      <div class="card">
        <button class="btn ${S.learn===i?'s':''}" onclick="S.learn=S.learn===${i}?null:${i};render()">${l[0]} ${l[1]}</button>
        ${S.learn === i ? `<p style="line-height:1.55;margin:10px 0;font-weight:700">${esc(l[2])}</p><button class="btn o" onclick="speak(LEARN[${i}][2])">🔊 माहिती ऐका</button>` : ''}
      </div>
    `).join('')}
  </div>`;
}

function render() {
  if (!cu()) { $('app').innerHTML = renderAuth(); return; }
  $('app').innerHTML = `
    <div class="topbar">
      <div class="brand">
        ${S.v !== 'home' ? `<button onclick="go('home')" style="background:#ffffff30;border:0;color:#fff;border-radius:10px;padding:4px 10px;font-size:18px;cursor:pointer">←</button>` : ''}
        <span>🌾 ${LANGS[S.lang].title}</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <div class="lang-pills">
          <button class="lang-pill ${S.lang==='mr'?'active':''}" onclick="S.lang='mr';render()">मराठी</button>
          <button class="lang-pill ${S.lang==='hi'?'active':''}" onclick="S.lang='hi';render()">हिंदी</button>
          <button class="lang-pill ${S.lang==='en'?'active':''}" onclick="S.lang='en';render()">EN</button>
        </div>
        <button onclick="logout()" title="बाहेर पडा" style="background:#ffffff30;border:0;color:#fff;border-radius:10px;padding:4px 8px;font-size:16px;cursor:pointer">⎋</button>
      </div>
    </div>
    <div style="padding:8px 14px 0"><span class="tag">${esc(cu().name)} • ${cu().role==='farmer'?'👨‍🌾 शेतकरी':'👷 कामगार'}</span></div>
    ${renderBody()}
    <div class="nav">
      <button class="${S.v==='home'?'on':''}" onclick="go('home')"><span>🏠</span>मुख्य</button>
      <button class="${S.v==='voice'?'on':''}" onclick="go('voice')"><span>🎙️</span>AI बोला</button>
      <button class="${S.v==='map'?'on':''}" onclick="go('map')"><span>🗺️</span>नकाशा</button>
      <button class="${S.v==='jobs'?'on':''}" onclick="go('jobs')"><span>👷</span>काम</button>
      <button class="${S.v==='learn'?'on':''}" onclick="go('learn')"><span>📚</span>ज्ञान</button>
    </div>
  `;
  if (S.v === 'voice' && S.aiMode === 'hw') initHwCanvas();
}

if ('geolocation' in navigator) {
  navigator.geolocation.getCurrentPosition(pos => {
    S.userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
  }, () => {});
}

render();
</script>
</body>
</html>
